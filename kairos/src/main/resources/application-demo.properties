
# ==========================================
# KAIROS - PERFIL DEMO
# ==========================================

spring.application.name=kairos-demo

# ==========================================
# DATABASE
# ==========================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/kairos_demo?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false

# ==========================================
# DATA SEEDER
# ==========================================

kairos.demo.enabled=true

# ==========================================
# LOGGING
# ==========================================

logging.level.com.uarg.flow=INFO
logging.level.org.springframework.security=INFO
