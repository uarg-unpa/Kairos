<div class="card">
  <div class="card-header">
    <h5>Editar Usuario</h5>
  </div>
  <div class="card-body" *ngIf="usuario">
    <form (ngSubmit)="guardar()">
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" class="form-control" [(ngModel)]="usuario.nombre" name="nombre" required />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" class="form-control" [(ngModel)]="usuario.email" name="email" required />
      </div>
      <div class="mt-3">
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a routerLink="/usuarios" class="btn btn-secondary ml-2">Cancelar</a>
      </div>
    </form>
  </div>
</div>
