<div class="ayuda-layout">
  <button class="sidebar-toggle" (click)="toggleSidebar()">&#9776;</button>
  <nav class="sidebar" [class.open]="sidebarOpen">
    <button class="close-btn" (click)="toggleSidebar()">&times;</button>
    <ul>
      <li *ngFor="let paso of pasos">
        <a (click)="scrollToSection(paso.id)">{{ paso.titulo }}</a>
      </li>
    </ul>
  </nav>
  <div class="ayuda-container">
    <h1>Manual del Usuario - Kairos</h1>




    <!-- Tooltip flotante del tour, posicionado cerca del elemento objetivo -->


    <section *ngFor="let paso of pasos" [attr.id]="paso.id">
      <h2>{{ paso.titulo }}</h2>
      <p>{{ paso.descripcion }}</p>
      <ul *ngIf="paso.pasos">
        <li *ngFor="let item of paso.pasos">{{ item }}</li>
      </ul>
      <p *ngIf="paso.cierre">{{ paso.cierre }}</p>
      <div *ngIf="paso.videoUrl">
        <ng-container *ngIf="paso.videoUrl.includes('youtube.com') || paso.videoUrl.includes('youtu.be'); else localVideo">
          <iframe width="480" height="270" [src]="paso.videoUrl | safeUrl" frameborder="0" allowfullscreen></iframe>
        </ng-container>
        <ng-template #localVideo>
          <video width="480" controls>
            <source [src]="paso.videoUrl" type="video/mp4">
            Tu navegador no soporta la reproducción de video.
          </video>
        </ng-template>
      </div>
    </section>
  </div>
</div>
