<div class="ayuda-layout">

  <!-- BOTÓN -->
  <button class="sidebar-toggle" (click)="toggleSidebar()">☰</button>

  <!-- SIDEBAR -->
  <nav class="sidebar" [class.open]="sidebarOpen">
    <button class="close-btn" (click)="toggleSidebar()">×</button>
    <ul>
      <li *ngFor="let paso of pasos">
        <a (click)="scrollToSection(paso.id)">
          {{ paso.titulo }}
        </a>
      </li>
    </ul>
  </nav>

  <!-- CONTENIDO -->
  <div class="ayuda-container">
    <h1>Centro de Ayuda - Kairos</h1>

    <section *ngFor="let paso of pasos" [attr.id]="paso.id">

      <h2>{{ paso.titulo }}</h2>

      <div [ngSwitch]="paso.tipo">

        <!-- TEXTO NORMAL -->
        <div *ngSwitchCase="'info'">
          <p *ngFor="let item of paso.contenido">
            {{ item }}
          </p>
        </div>

        <!-- PASOS -->
        <ul *ngSwitchCase="'pasos'" class="pasos-lista">
          <li *ngFor="let item of paso.contenido">
            {{ item }}
          </li>
        </ul>

        <!-- TIPS -->
        <ul *ngSwitchCase="'tips'" class="tips-lista">
          <li *ngFor="let item of paso.contenido">
            {{ item }}
          </li>
        </ul>

      </div>

      <!-- VIDEO -->
      <div *ngIf="paso.videoUrl" class="video-container">
        <iframe
          width="480"
          height="270"
          [src]="paso.videoUrl | safeUrl"
          frameborder="0"
          allowfullscreen>
        </iframe>
      </div>

    </section>
  </div>

</div>
