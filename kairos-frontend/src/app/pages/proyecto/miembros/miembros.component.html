<div class="container my-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3>Miembros del Proyecto</h3>
    <button *ngIf="rolEnProyecto === 'Admin'" 
            class="btn btn-primary" 
            (click)="abrirModalAgregar()">
      <i class="bi bi-plus-circle"></i> Agregar Miembro
    </button>
  </div>

  <div class="row g-4">
    <div class="col-md-4" *ngFor="let miembro of miembros">
      <div class="member-card p-4 rounded shadow-sm border">
        <div class="d-flex align-items-center gap-3 mb-3">
          <!-- AVATAR -->
          <div class="avatar bg-primary text-white d-flex align-items-center justify-content-center">
            {{ miembro.nombre.charAt(0).toUpperCase() }}
          </div>
          <!-- NOMBRE Y EMAIL -->
          <div>
            <h5 class="mb-1">{{ miembro.nombre }}</h5>
            <p class="text-muted small mb-0">{{ miembro.email }}</p>
          </div>
        </div>

        <!-- ROL + LÁPIZ -->
        <div class="d-flex align-items-center gap-2 mb-2">
            <h6 class="mb-0">Rol:</h6>
            <span class="badge bg-info text-dark">{{ miembro.rolProyecto || 'Sin etiqueta' }}</span>
            <button *ngIf="rolEnProyecto === 'Admin' || rolEnProyecto === 'Líder'"
                    class="btn btn-sm btn-link text-muted p-0 ms-1"
                    (click)="abrirModalEditar(miembro)"
                    [disabled]="esLiderActual && us()"
                    title="Editar etiqueta">
                <i class="bi bi-pencil"></i>
            </button>
        </div>

        <!-- ACCIONES -->
        <div class="d-flex gap-2">
          <button class="btn btn-sm btn-outline-danger" 
                  *ngIf="rolEnProyecto === 'Admin' || rolEnProyecto === 'Líder'">
            Eliminar
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL AGREGAR -->
<div class="modal fade" [class.show]="mostrarModalAgregar" [style.display]="mostrarModalAgregar ? 'block' : 'none'" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Agregar Miembro</h5>
        <button type="button" class="btn-close" (click)="cerrarModalAgregar()"></button>
      </div>
      <div class="modal-body">
      <div class="mb-3">
        <label class="form-label">Buscar usuario existente</label>
        <input 
          type="text" 
          class="form-control" 
          [(ngModel)]="searchQuery" 
          (input)="buscarUsuarios()"
          placeholder="Escribe al menos 2 letras...">
        
        <div class="list-group mt-2" *ngIf="usuariosBusqueda.length > 0">
          <button 
            *ngFor="let usuario of usuariosBusqueda" 
            type="button"
            class="list-group-item list-group-item-action"
            (click)="seleccionarUsuario(usuario)">
            {{ usuario.nombre }} ({{ usuario.email }})
          </button>
        </div>
      </div>
        <hr>
        <h6>O invita por email</h6>
        <input type="email" class="form-control mb-2" placeholder="Email" [(ngModel)]="newEmail">
        <h6>Ingresar rol</h6>
        <input type="text" class="form-control mb-3" [(ngModel)]="newRol" placeholder="Ej: Diseñador, Analista, Programador">
        <button class="btn btn-success w-100" (click)="agregarMiembro()">Invitar</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-backdrop fade show" *ngIf="mostrarModalAgregar" style="z-index: 1050;"></div>

<!-- MODAL EDITAR ROL -->
<!-- MODAL EDITAR ROL -->
<div class="modal fade" 
     [class.show]="mostrarModalEditar" 
     [style.display]="mostrarModalEditar ? 'block' : 'none'" 
     style="z-index: 1055;" 
     tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Etiqueta de {{ usuarioEdit.nombre }}</h5>
        <button type="button" class="btn-close" (click)="cerrarModalEditar()"></button>
      </div>
      <div class="modal-body">
        <label class="form-label">Etiqueta (ej: Diseñador, Analista, Programador)</label>
        <input type="text" 
               class="form-control" 
               [(ngModel)]="rolEdit" 
               [disabled]="esLiderActual"
               placeholder="Ej: Programador Senior">
        <small class="text-muted" *ngIf="esLiderActual">
          El líder del proyecto no puede cambiar su etiqueta.
        </small>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" (click)="cerrarModalEditar()">Cancelar</button>
        <button class="btn btn-primary" 
                (click)="actualizarRol()" 
                [disabled]="esLiderActual">
          Guardar
        </button>
      </div>
    </div>
  </div>
</div>

<!-- BACKDROP -->
<div class="modal-backdrop fade show" *ngIf="mostrarModalEditar" style="z-index: 1050;"></div>
<!-- FONDO OSCURO (BACKDROP) -->
<div class="modal-backdrop fade show" 
     *ngIf="mostrarModalEditar" 
     style="z-index: 1050;">
</div>
