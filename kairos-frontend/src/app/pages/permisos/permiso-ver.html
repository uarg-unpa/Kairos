<div class="container my-5">
  <div class="card shadow-lg" *ngIf="permiso">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0"><i class="bi bi-eye"></i> Detalles del Permiso: {{ permiso.nombre }}</h4>
    </div>
    <div class="card-body p-4">
      <div class="d-flex justify-content-between align-items-start mb-4">
        <h5 class="card-title text-primary">Información del Permiso</h5>
      </div>

      <dl class="row">
        <dt class="col-sm-3 text-muted">ID Sistema:</dt>
        <dd class="col-sm-9 text-muted">{{ permiso.id }}</dd>

        <dt class="col-sm-3">Nombre:</dt>
        <dd class="col-sm-9">{{ permiso.nombre }}</dd>
      </dl>

      <div class="mt-4">
        <a [routerLink]="['/permiso/modificar', permiso.id]" class="btn btn-outline-primary me-2">
          <i class="bi bi-pencil"></i> Modificar
        </a>
        <button (click)="eliminar()" class="btn btn-outline-danger me-2">
          <i class="bi bi-trash"></i> Eliminar
        </button>
        <a routerLink="/permisos" class="btn btn-secondary">
          Volver
        </a>
      </div>
    </div>
  </div>
</div>
