<div class="container mt-4 main-content">
  <div class="card shadow-sm">
    <div class="card-header d-flex justify-content-between align-items-center bg-primary text-white">
      <h4 class="mb-0">
        <i class="bi bi-lock-locked me-2"></i> Permisos
      </h4>
      <a routerLink="/permisos/crear" class="btn btn-light btn-sm">
        <i class="bi bi-plus-circle me-1"></i> Crear Permiso
      </a>
    </div>

    <div class="card-body p-4">
      <!-- ESTADO: CARGANDO -->
      @if (!permisos()) {
        <div class="text-center py-4">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Cargando...</span>
          </div>
          <p class="mt-3 text-muted">Cargando permisos...</p>
        </div>
      }

      <!-- ESTADO: HAY PERMISOS -->
      @else if (permisos().length > 0) {
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead class="table-light">
              <tr>
                <th scope="col" style="width: 10%;">ID</th>
                <th scope="col" style="width: 70%;">Nombre</th>
                <th scope="col" class="text-center" style="width: 20%;">Acciones</th>
              </tr>
            </thead>
            <tbody>
              @for (permiso of permisos(); track permiso.id) {
                <tr>
                  <td><strong>{{ permiso.id }}</strong></td>
                  <td>{{ permiso.nombre }}</td>
                  <td class="text-center">
                    <div class="btn-group" role="group">
                      <a [routerLink]="['/permiso/ver', permiso.id]"
                         class="btn btn-outline-info btn-sm"
                         title="Ver detalles">
                         <i class="bi bi-eye"></i>
                      </a>
                      <a [routerLink]="['/permiso/modificar', permiso.id]"
                         class="btn btn-outline-warning btn-sm"
                         title="Editar">
                         <i class="bi bi-pencil"></i>
                      </a>
                      <button (click)="eliminar(permiso.id, permiso.nombre)"
                              class="btn btn-outline-danger btn-sm"
                              title="Eliminar">
                              <i class="bi bi-trash"></i>
                      </button>
                    </div>
                  </td>
                </tr>
              }
            </tbody>
          </table>
        </div>
      }

      <!-- ESTADO: SIN PERMISOS -->
      @else {
        <div class="text-center py-5">
          <i class="bi bi-lock-locked display-1 text-muted"></i>
          <p class="mt-3 text-muted">No hay permisos definidos.</p>
        </div>
      }
    </div>
  </div>
</div>
