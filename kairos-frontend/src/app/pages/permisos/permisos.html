<h2>Permisos</h2>

<div class="container mt-4">
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h4><span class="bi bi-lock-locked"></span> Permisos</h4>
            <a routerLink="/permisos/crear" class="btn btn-success">
                <span class="bi bi-plus"></span> Crear Permiso
            </a>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th style="width: 10%;">ID</th>
                            <th style="width: 70%;">Nombre</th>
                            <th style="width: 20%;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        @for (permiso of permisos(); track permiso.id) {
                            <tr>
                                <td>{{ permiso.id }}</td>
                                <td>{{ permiso.nombre }}</td>
                                <td>
                                    <div class="btn-group" role="group">
                                        <a [routerLink]="['/permiso/ver', permiso.id]" class="btn btn-info btn-sm">
                                            <span class="bi bi-eye"></span>
                                        </a>
                                        <a [routerLink]="['/permiso/modificar', permiso.id]" class="btn btn-warning btn-sm">
                                            <span class="bi bi-pencil"></span>
                                        </a>
                                        <button (click)="eliminar(permiso.id, permiso.nombre)" class="btn btn-danger btn-sm">
                                            <span class="bi bi-trash"></span>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        }
                        @empty {
                            <tr>
                                <td colspan="3" class="text-center text-muted">No hay permisos definidos.</td>
                            </tr>
                        }
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
