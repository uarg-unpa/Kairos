<div class="container py-4">

  <!-- Encabezado -->
  <div class="d-flex justify-content-between align-items-center mb-1">
    <h2 class="mb-0">Planificación de Tareas - <span *ngIf="proyectoNombre">{{ proyectoNombre }}</span></h2>
    <div class="d-flex gap-2">
      <button type="button" class="btn btn-primary" (click)="onAbrirModalCrear()">
        Nueva Tarea
      </button>
      <button type="button" class="btn btn-primary" (click)="categoriesModal.abrirModal()">
        Categorias
      </button>
      <button class="btn btn-outline-primary">
        <i class="bi bi-plus-circle me-2"></i>Tareas propuestas
      </button>
    </div>
  </div>
  <h4 class="text-muted">
      Iteración: {{ filtroIteracionId }} – {{ iteracionActual?.etapaNombre }}
    </h4>

  <!-- Filtro vencimiento -->
  <div *ngIf="filtroVencimiento" class="alert alert-info d-flex align-items-center justify-content-between mb-3">
    <span>
      Filtro: {{ filtroVencimiento === 'proximas' ? 'Próximos vencimientos (7 días)' : 'Tareas atrasadas' }}
    </span>
    <button class="btn btn-sm btn-outline-secondary" (click)="clearVencimientoFilter()">Quitar filtro</button>
  </div>

  <div class="row g-4">
    <!-- Panel Principal -->
    <div class="col-lg-9">
      <!-- Filtros -->
      <app-task-filters [categorias]="categorias" [usuarios]="usuarios" [filtroCategoria]="filtroCategoria"
        [filtroResponsable]="filtroResponsable" [filtroEstado]="filtroEstado" [filtroFechaDesde]="filtroFechaDesde"
        [filtroFechaHasta]="filtroFechaHasta" (filtrosChange)="onFiltrosChange($event)">
      </app-task-filters>



      <!-- Lista de Tareas -->
      <app-task-list [tareas]="tareasFiltradas()" [comentariosPorTarea]="comentariosPorTarea" [usuarios]="usuarios"
        [paginaActual]="paginaActual" [tareasPorPagina]="tareasPorPagina" (editarTarea)="onAbrirModalEditar($event)"
        (eliminarTarea)="onEliminarTarea($event)" (cambiarEstado)="onCambiarEstado($event)"
        (abrirComentarios)="onAbrirComentarios($event)" (cambiarPagina)="onCambiarPagina($event)"
        (eliminarComentario)="onEliminarComentario($event)">
      </app-task-list>
    </div>

    <!-- Panel Lateral -->
    <div class="col-lg-3">
      <app-stats-panel [tareas]="tareasFiltradas()"></app-stats-panel>
    </div>
  </div>
</div>

<!-- Modales -->
<app-task-form-modal [tareaEnEdicion]="null" [categorias]="categorias" [usuarios]="usuarios"
  [iteracionActual]="iteracionActual" [tareas]="tareas" (guardarTarea)="onGuardarTarea($event)">
</app-task-form-modal>

<app-categories-modal [categorias]="categorias" (agregarCategoria)="onAgregarCategoria($event)"
  (editarCategoria)="onEditarCategoria($event)" (eliminarCategoria)="onEliminarCategoria($event)">
</app-categories-modal>

<app-comments-modal [usuarioActual]="usuarioActual" (agregarComentario)="onAgregarComentario($event)">
</app-comments-modal>
