<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
  <h3 class="mb-0">Etapas</h3>
  <div class="d-flex gap-2">
    <div class="input-group" style="width: 320px;">
      <span class="input-group-text">Proyecto ID</span>
      <input [(ngModel)]="proyectoId" type="number" class="form-control" placeholder="(opcional)" />
      <button (click)="cargar()" class="btn btn-outline-primary">Filtrar</button>
    </div>
    <button class="btn btn-primary" (click)="abrirModal()">
      <i class="bi bi-plus-circle"></i> Nueva Etapa
    </button>
  </div>
  </div>

<div *ngIf="loading" class="text-muted">Cargando etapas...</div>

<div class="row g-4" *ngIf="!loading">
  <div *ngIf="etapas.length === 0" class="text-muted">Sin etapas</div>
  <div class="col-lg-6 col-md-12" *ngFor="let e of etapas">
    <a [routerLink]="['/etapas', e.idEtapa, 'iteraciones']" class="text-decoration-none text-dark">
      <div class="card stage-card h-100">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start mb-3">
            <div>
              <h5 class="card-title mb-2">{{ e.nombre }}</h5>
              <p class="text-muted mb-2">{{ e.descripcion || '' }}</p>
              <div class="d-flex align-items-center gap-3 mb-2">
                <small class="text-muted"><i class="bi bi-calendar"></i> {{ e.fechaInicio }} - {{ e.fechaFin }}</small>
                <small class="text-muted"><i class="bi bi-list-check"></i> Iteraciones: {{ e.iteraciones }}</small>
              </div>
            </div>
          </div>
        </div>
      </div>
    </a>
  </div>
</div>

<!-- Modal Crear Etapa -->
<div class="modal fade" id="addEtapaModal" tabindex="-1" aria-labelledby="addEtapaLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="addEtapaLabel">Crear Etapa</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input [(ngModel)]="nuevaEtapa.nombre" type="text" class="form-control" placeholder="Nombre de la etapa" />
        </div>
        <div class="mb-3">
          <label class="form-label">Descripción</label>
          <textarea [(ngModel)]="nuevaEtapa.descripcion" class="form-control" rows="3" placeholder="Descripción"></textarea>
        </div>
        <div class="row g-2">
          <div class="col">
            <label class="form-label">Fecha Inicio</label>
            <input [(ngModel)]="nuevaEtapa.fechaInicio" type="date" class="form-control" />
          </div>
          <div class="col">
            <label class="form-label">Fecha Fin</label>
            <input [(ngModel)]="nuevaEtapa.fechaFin" type="date" class="form-control" />
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" (click)="crearEtapa()">Crear</button>
      </div>
    </div>
  </div>
 </div>
