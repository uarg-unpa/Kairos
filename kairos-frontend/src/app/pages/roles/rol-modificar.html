<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h4><span class="bi bi-pencil"></span> Modificar Rol: {{ nombre }}</h4>
        </div>
        <div class="card-body">
            <form (ngSubmit)="guardar()">
                <div class="form-group mb-3">
                    <label for="nombre">Nombre del Rol:</label>
                    <input type="text" class="form-control" id="nombre" name="nombre" [(ngModel)]="nombre" required>
                </div>
                
                <div class="form-group mb-3">
                    <label>Permisos:</label>
                    @if (permisos().length > 0) {
                        <div class="row">
                            @for (permiso of permisos(); track permiso.id) {
                                <div class="col-md-6">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" 
                                               [id]="'permiso_' + permiso.id" 
                                               [value]="permiso.id"
                                               [checked]="estaSeleccionado(permiso.id)"
                                               (change)="togglePermiso(permiso.id, $event.target.checked)">
                                        <label class="form-check-label" [for]="'permiso_' + permiso.id">
                                            <span class="bi bi-lock-locked"></span>
                                            <span>{{ permiso.nombre }}</span>
                                        </label>
                                    </div>
                                </div>
                            }
                        </div>
                    } @else {
                        <p class="text-muted">Cargando permisos...</p>
                    }
                </div>
                
                <div class="mt-3">
                    <button type="submit" class="btn btn-warning">
                        <span class="bi bi-check"></span> Modificar Rol
                    </button>
                    <a routerLink="/roles" class="btn btn-secondary ms-2">
                        <span class="bi bi-x"></span> Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
