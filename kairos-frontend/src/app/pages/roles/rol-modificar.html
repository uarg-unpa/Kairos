<div class="container my-5">
  <div class="card shadow-lg">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0"><i class="bi bi-pencil"></i> Modificar Rol: {{ nombre }}</h4>
    </div>
    <div class="card-body p-4">
      <div class="d-flex justify-content-between align-items-start mb-4">
        <h5 class="card-title text-primary">Modificar Datos</h5>
      </div>

      <form (ngSubmit)="guardar()">
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre del Rol:</label>
          <input type="text" class="form-control" id="nombre" name="nombre" [(ngModel)]="nombre" required>
        </div>
        
        <div class="mb-3">
          <label class="form-label">Permisos:</label>
          @if (permisos().length > 0) {
            <div class="row">
              @for (permiso of permisos(); track permiso.id) {
                <div class="col-md-6 mb-2">
                  <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" 
                           [id]="'permiso_' + permiso.id" 
                           [value]="permiso.id"
                           [checked]="estaSeleccionado(permiso.id)"
                           (change)="togglePermiso(permiso.id, $event.target.checked)">
                    <label class="form-check-label ms-2" [for]="'permiso_' + permiso.id">
                      <i class="bi bi-lock-locked text-muted"></i> {{ permiso.nombre }}
                    </label>
                  </div>
                </div>
              }
            </div>
          } @else {
            <p class="text-muted">Cargando permisos...</p>
          }
        </div>
        
        <div class="mt-4">
          <button type="submit" class="btn btn-primary me-2">
            Guardar Cambios
          </button>
          <a routerLink="/roles" class="btn btn-secondary">
            Cancelar
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
