<div class="container mt-4">
    <div class="card" *ngIf="rol">
        <div class="card-header">
            <h4><span class="bi bi-eye"></span> Ver Rol: {{ rol.nombre }}</h4>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-6">
                    <h5>Información del Rol</h5>
                    <table class="table table-borderless">
                        <tr>
                            <th>ID:</th>
                            <td>{{ rol.id }}</td>
                        </tr>
                        <tr>
                            <th>Nombre:</th>
                            <td>{{ rol.nombre }}</td>
                        </tr>
                    </table>
                </div>
                <div class="col-md-6">
                    <h5>Permisos Asignados</h5>
                    <div *ngIf="rol.permisos.length === 0">
                        <p class="text-muted">No tiene permisos asignados</p>
                    </div>
                    <div *ngIf="rol.permisos.length > 0">
                        <ul class="list-group">
                            @for (permiso of rol.permisos; track $index) {
                                <li class="list-group-item">
                                    <span class="bi bi-lock-locked"></span>
                                    <span>{{ permiso }}</span>
                                </li>
                            }
                        </ul>
                    </div>
                </div>
            </div>
            
            <div class="mt-3">
                <a [routerLink]="['/rol/modificar', rol.id]" class="btn btn-warning">
                    <span class="bi bi-pencil"></span> Modificar
                </a>
                <button (click)="eliminar()" class="btn btn-danger ms-2">
                    <span class="bi bi-trash"></span> Eliminar
                </button>
                <a routerLink="/roles" class="btn btn-secondary ms-2">
                    <span class="bi bi-arrow-left"></span> Volver
                </a>
            </div>
        </div>
    </div>
</div>
