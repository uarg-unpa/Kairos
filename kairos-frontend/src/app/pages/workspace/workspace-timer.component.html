<div class="card workspace-card mb-4">
    <div class="card-header bg-primary text-white">
        <h5 class="mb-0">
            <i class="bi bi-stopwatch me-2"></i>Cronómetro
        </h5>
    </div>
    <div class="card-body text-center">
        <div class="timer-display text-primary mb-4" id="timerDisplay">{{ elapsedTimeDisplay }}</div>
        
        <div class="mb-3">
            <select class="form-select" [(ngModel)]="selectedTaskId" [disabled]="timerState.startTime !== null">
                <option [ngValue]="null">Seleccionar tarea...</option>
                <option *ngFor="let task of availableTasks" [ngValue]="task.id">
                    {{ task.title }}
                </option>
            </select>
        </div>
        
        <div class="d-flex justify-content-center gap-2 mb-3">
            <button 
                class="btn btn-success btn-timer" 
                id="startTimer" 
                title="{{ timerState.isPaused ? 'Reanudar' : 'Iniciar' }}"
                (click)="handleStart()"
                [disabled]="timerState.startTime !== null && !timerState.isPaused"
            >
                <i class="bi bi-play-fill"></i>
            </button>
            
            <button 
                class="btn btn-warning btn-timer" 
                id="pauseTimer" 
                title="Pausar"
                (click)="handlePause()"
                [disabled]="!timerState.startTime || timerState.isPaused"
            >
                <i class="bi bi-pause-fill"></i>
            </button>
            
            <button 
                class="btn btn-danger btn-timer" 
                id="stopTimer" 
                title="Detener"
                (click)="handleStop()"
                [disabled]="timerState.startTime === null"
            >
                <i class="bi bi-stop-fill"></i>
            </button>
        </div>
        
        <div class="alert" [ngClass]="getTimerStatusClass()">
            <i class="bi bi-info-circle me-2"></i>
            {{ getTimerStatusText() }}
        </div>
    </div>
</div>
